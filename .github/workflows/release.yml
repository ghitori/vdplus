name: Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      release: ${{ steps.version.outputs.release }}
      buildname: ${{ steps.version.outputs.buildname }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check version upgrade
        id: version
        run: |
          name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          sha6=${GITHUB_SHA:0:6}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$name" >/dev/null; then
            echo "Tag v$name already exists -> build only ($sha6)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "buildname=$sha6" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$name not found -> release v$name."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "buildname=$name" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use commit hash as versionName (no version bump)
        if: needs.check.outputs.release != 'true'
        run: |
          sed -i -E 's/^[[:space:]]*versionName[[:space:]]+.*$/    versionName "${{ needs.check.outputs.buildname }}"/' app/build.gradle
          grep -n 'versionName' app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Show built APK versionName
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt 2>/dev/null | head -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -m1 '^package:'
          else
            echo "aapt not found, skip"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdplus-${{ needs.check.outputs.buildname }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: needs.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish release to Xposed-Modules-Repo
        if: needs.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Xposed-Modules-Repo/com.ghitori.vdplus
          token: ${{ secrets.MODULE_REPO_TOKEN }}
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
